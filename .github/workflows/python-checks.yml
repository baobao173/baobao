name: Python checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [guess-number, citibike-tide-and-dispatch, road-safety-risk-analysis, retail-demand-inventory]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
      - name: Run tests
        working-directory: ${{ matrix.project }}
        run: |
          if [ -d tests ]; then python -m unittest discover -s tests -v; else python -m unittest discover -v; fi
